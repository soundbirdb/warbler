[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "warbler"
version = "0.1.0"
description = "Batch-process and tag audio files using spectral fingerprinting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "librosa>=0.10",
    "mutagen>=1.47",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
warbler = "warbler.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["warbler"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
